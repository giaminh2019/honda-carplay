<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Honda CarPlay | Map + YouTube</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{color-scheme:dark;--bg:#080e18;--panel:#111c2a;--edge:#26384c;--accent:#38bdf8;--txt:#ecf5ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}header{height:45px;display:flex;align-items:center;gap:7px;padding:5px 10px;background:#111a28;border-bottom:1px solid var(--edge)}.brand{font-weight:750;white-space:nowrap;margin-right:auto;color:#cdeeff}button{background:#223448;color:#fff;border:1px solid #3a5269;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer}button:active{background:#326185}.active{background:#075985;border-color:#0ea5e9}main{display:flex;width:100%;height:calc(100% - 45px);gap:5px;padding:5px}.pane{position:relative;min-width:0;flex:1;overflow:hidden;border:1px solid var(--edge);border-radius:10px;background:#0b1320;display:flex;flex-direction:column}.pane-head{height:39px;flex:none;display:flex;align-items:center;gap:5px;padding:4px 7px;background:#172536}.pane-title{font-weight:700;white-space:nowrap}.pane-head input{width:50px;min-width:0;flex:1;background:#0a1522;color:#fff;border:1px solid #42566a;border-radius:6px;padding:6px;font-size:12px}.pane-head button{padding:6px 8px}.content{flex:1;position:relative;min-height:0}iframe,#map{height:100%;width:100%;border:0;background:#101923}.hint{position:absolute;left:9px;bottom:10px;right:9px;pointer-events:none;background:#0b1222d9;color:#c9d9e8;padding:7px 9px;border-radius:7px;font-size:11px}.large #mapPane,.large #videoPane{flex:1}.focus-map #mapPane,.focus-video #videoPane{flex:1}.focus-map #videoPane,.focus-video #mapPane{display:none}.swapped{flex-direction:row-reverse}.map-wait{position:absolute;top:52px;left:8px;background:#0f1c2fbd;color:#eff5ff;border-radius:6px;padding:5px 8px;font-size:11px;pointer-events:none}#mapError{display:none;position:absolute;top:50%;left:8%;width:84%;padding:12px;background:#172536;color:#fff;border-radius:8px;text-align:center}@media(max-width:700px){header{gap:4px;padding:4px}.brand{font-size:11px}button{font-size:11px;padding:6px}.pane-head{height:38px}.pane-title{font-size:11px}.pane-head input{font-size:11px}}
</style></head><body>
<header><span class="brand">🚗 CarPlay Split</span><button id="swap">⇄ Đổi bên</button><button id="both" class="active">2 cột</button><button id="justMap">🗺 Bản đồ</button><button id="justVideo">▶ Video</button></header>
<main id="layout"><section class="pane" id="mapPane"><div class="pane-head"><span class="pane-title">🗺 Bản đồ</span><input id="destination" placeholder="Nhập điểm đến..." aria-label="Điểm đến"><button id="locate">⌖ GPS</button><button id="route">Đi đường ↗</button></div><div class="content"><div id="map"></div><div id="mapError">Không tải được bản đồ. Hãy kiểm tra Internet và quyền định vị.</div><div class="map-wait" id="mapWait">Bản đồ OpenStreetMap • Định vị cần HTTPS</div></div></section>
<section class="pane" id="videoPane"><div class="pane-head"><span class="pane-title">▶ YouTube</span><input id="youtubeUrl" placeholder="Dán link video YouTube"><button id="play">Mở</button></div><div class="content"><iframe id="player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="YouTube Player"></iframe><div class="hint" id="hint">Dán link video YouTube vào ô trên, bấm Mở. Một số video không cho phép nhúng hoặc CarPlay có thể chặn phát.</div></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(function(){'use strict';const $=id=>document.getElementById(id), layout=$('layout');let map,marker,watchId=null,lastCoords=null;function saved(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}function makeMap(){if(!window.L){$('mapError').style.display='block';return}map=L.map('map',{zoomControl:true}).setView([21.0285,105.8542],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);setTimeout(()=>map.invalidateSize(),400)}function locate(){if(!navigator.geolocation){$('mapWait').textContent='Trình duyệt không hỗ trợ GPS';return}$('mapWait').textContent='Đang xác định vị trí…';navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;lastCoords={lat,lng};if(map){if(marker)marker.setLatLng([lat,lng]);else marker=L.circleMarker([lat,lng],{radius:9,color:'#ffffff',weight:3,fillColor:'#0ea5e9',fillOpacity:1}).addTo(map);map.setView([lat,lng],16)}$('mapWait').textContent='● Vị trí của bạn • Bản đồ OSM'},e=>{$('mapWait').textContent='Không lấy được GPS (kiểm tra quyền vị trí và HTTPS)'},{enableHighAccuracy:true,timeout:12000,maximumAge:15000})}function videoId(s){s=s.trim();if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;try{let u=new URL(s);let host=u.hostname.replace(/^www\./,'');if(host==='youtu.be')return u.pathname.split('/')[1];if(host.endsWith('youtube.com')||host==='m.youtube.com'||host==='music.youtube.com'){if(u.searchParams.get('v'))return u.searchParams.get('v');let m=u.pathname.match(/^\/(?:shorts|embed|live)\/([A-Za-z0-9_-]{11})/);return m&&m[1]}}catch(e){}return null}function loadVideo(){let value=$('youtubeUrl').value.trim(),id=videoId(value);if(!id){alert('Hãy dán link video YouTube (ví dụ https://www.youtube.com/watch?v=...)');return}store('yt',value);$('player').src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=0';$('hint').style.display='none'}function setMode(mode){layout.classList.remove('focus-map','focus-video');if(mode!=='both')layout.classList.add(mode==='map'?'focus-map':'focus-video');for(let id of ['both','justMap','justVideo'])$(id).classList.remove('active');$(mode==='both'?'both':mode==='map'?'justMap':'justVideo').classList.add('active');if(map)setTimeout(()=>map.invalidateSize(),180)}$('swap').onclick=()=>{layout.classList.toggle('swapped');if(map)setTimeout(()=>map.invalidateSize(),180)};$('both').onclick=()=>setMode('both');$('justMap').onclick=()=>setMode('map');$('justVideo').onclick=()=>setMode('video');$('locate').onclick=locate;$('play').onclick=loadVideo;$('youtubeUrl').onkeydown=e=>{if(e.key==='Enter')loadVideo()};$('destination').onkeydown=e=>{if(e.key==='Enter')$('route').click()};$('route').onclick=()=>{let dest=$('destination').value.trim();if(!dest){alert('Nhập điểm đến trước');return}store('destination',dest);let url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&travelmode=driving';window.open(url,'_blank','noopener,noreferrer')};$('youtubeUrl').value=saved('yt');$('destination').value=saved('destination');makeMap();})();
</script></body></html>
